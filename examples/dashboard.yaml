# Example dashboard for one zone (example.com), drawn with button-card
# (https://github.com/custom-cards/button-card, installed through HACS).
#
# How to use it:
#   1. Create a dashboard, open it, select the pencil > three-dots menu > Raw configuration editor.
#   2. Paste this file.
#   3. Replace "cloudflare_example_com_example_com_" with the prefix of your own entities, and
#      "example.com" with your zone. The prefix is shown under Settings > Devices & services >
#      Cloudflare Abuse Monitor > the zone's device.
#   4. For a second zone, copy the view and replace the prefix again.
#
# If your dashboard already has views, copy "button_card_templates" to the top of its raw configuration
# and the view under "views".
button_card_templates:
  cf_tile:
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: more-info
    hold_action:
      action: more-info
    styles:
      card:
      - border-radius: 22px
      - direction: ltr
      - box-shadow: 0 6px 18px rgba(0,0,0,.18)
      - padding: 14px
      - height: 104px
      - overflow: hidden
      grid:
      - grid-template-areas: '"top" "val" "lbl"'
      - grid-template-rows: 1fr min-content min-content
      - justify-items: start
      - row-gap: 2px
      custom_fields:
        top:
        - justify-self: stretch
        - align-self: start
        val:
        - font-size: 22px
        - font-weight: '900'
        - line-height: '1.15'
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%
        lbl:
        - font-size: 12px
        - opacity: '.8'
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
        - max-width: 100%
        bar:
        - justify-self: stretch
        - margin-top: 6px
views:
- title: Cloudflare
  path: cloudflare
  icon: mdi:cloud-lock-outline
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Business · Visitors
      icon: mdi:account-group-outline
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:button-card
        template: cf_tile
        entity: sensor.cloudflare_example_com_example_com_visitors_today
        custom_fields:
          top: |-
            [[[
            const c = '#29c5c8'; const bg = c.startsWith('var(') ? 'rgba(127,127,127,.15)' : c + '22';
            return `<div style="display:flex;justify-content:space-between;align-items:flex-start;width:100%">
              <div style="width:38px;height:38px;border-radius:12px;background:${bg};display:flex;align-items:center;justify-content:center">
                <ha-icon icon="mdi:account-group-outline" style="--mdc-icon-size:22px;color:${c}"></ha-icon></div></div>`;
             ]]]
          val: |-
            [[[
            const ok = s => s && !['unknown','unavailable'].includes(s.state);
            const num = s => ok(s) && !isNaN(parseFloat(s.state)) ? parseFloat(s.state) : null;
            const ltr = t => '⁦' + t + '⁩';  // keep numbers+units in reading order
            const v = num(entity); return v === null ? (ok(entity) ? entity.state : '—') : ltr(v.toLocaleString('en-US')); ]]]
          lbl: Unique visitors today
      - type: custom:button-card
        template: cf_tile
        entity: sensor.cloudflare_example_com_example_com_page_views_today
        custom_fields:
          top: |-
            [[[
            const c = '#3b82f6'; const bg = c.startsWith('var(') ? 'rgba(127,127,127,.15)' : c + '22';
            return `<div style="display:flex;justify-content:space-between;align-items:flex-start;width:100%">
              <div style="width:38px;height:38px;border-radius:12px;background:${bg};display:flex;align-items:center;justify-content:center">
                <ha-icon icon="mdi:file-eye-outline" style="--mdc-icon-size:22px;color:${c}"></ha-icon></div></div>`;
             ]]]
          val: |-
            [[[
            const ok = s => s && !['unknown','unavailable'].includes(s.state);
            const num = s => ok(s) && !isNaN(parseFloat(s.state)) ? parseFloat(s.state) : null;
            const ltr = t => '⁦' + t + '⁩';  // keep numbers+units in reading order
            const v = num(entity); return v === null ? (ok(entity) ? entity.state : '—') : ltr(v.toLocaleString('en-US')); ]]]
          lbl: Page views today
      - type: custom:button-card
        template: cf_tile
        entity: sensor.cloudflare_example_com_example_com_visitors_today
        custom_fields:
          top: |-
            [[[
            const c = (entity && entity.attributes && entity.attributes.visitors_change_7d_pct < 0) ? '#e5484d' : '#30a46c'; const bg = c.startsWith('var(') ? 'rgba(127,127,127,.15)' : c + '22';
            return `<div style="display:flex;justify-content:space-between;align-items:flex-start;width:100%">
              <div style="width:38px;height:38px;border-radius:12px;background:${bg};display:flex;align-items:center;justify-content:center">
                <ha-icon icon="${(entity && entity.attributes && entity.attributes.visitors_change_7d_pct < 0) ? 'mdi:trending-down' : 'mdi:trending-up'}" style="--mdc-icon-size:22px;color:${c}"></ha-icon></div></div>`;
             ]]]
          val: |-
            [[[
            const ltr = t => '⁦' + t + '⁩';  // keep numbers+units in reading order
            const v = entity && entity.attributes ? entity.attributes['visitors_change_7d_pct'] : null; return v === null || v === undefined ? '—' : ltr((v > 0 ? '+' : '') + v.toLocaleString('en-US') + '%'); ]]]
          lbl: Visitors · week vs previous
      - type: custom:button-card
        template: cf_tile
        entity: sensor.cloudflare_example_com_example_com_traffic_vs_usual
        custom_fields:
          top: |-
            [[[
            const c = '#f5a524'; const bg = c.startsWith('var(') ? 'rgba(127,127,127,.15)' : c + '22';
            return `<div style="display:flex;justify-content:space-between;align-items:flex-start;width:100%">
              <div style="width:38px;height:38px;border-radius:12px;background:${bg};display:flex;align-items:center;justify-content:center">
                <ha-icon icon="mdi:chart-timeline-variant" style="--mdc-icon-size:22px;color:${c}"></ha-icon></div></div>`;
             ]]]
          val: |-
            [[[
            const ok = s => s && !['unknown','unavailable'].includes(s.state);
            const num = s => ok(s) && !isNaN(parseFloat(s.state)) ? parseFloat(s.state) : null;
            const ltr = t => '⁦' + t + '⁩';  // keep numbers+units in reading order
            const v = num(entity); return v === null ? '—' : ltr(v + '%'); ]]]
          lbl: Traffic vs a usual day
    - type: custom:button-card
      entity: sensor.cloudflare_example_com_example_com_visitors_today
      show_name: false
      show_icon: false
      show_state: false
      tap_action:
        action: more-info
        entity: sensor.cloudflare_example_com_example_com_visitors_today
      hold_action:
        action: none
      custom_fields:
        body: |-
          [[[
          const ltr = t => '⁦' + t + '⁩';  // keep numbers+units in reading order
          const d = (entity && entity.attributes && entity.attributes.daily) || [];
          if (!d.length) return `<div style="opacity:.7;font-size:13px">No data yet</div>`;
          const max = Math.max(1, ...d.map(x => x['visitors'] || 0));
          const bars = d.map(x => { const v = x['visitors'] || 0; const h = Math.max(2, Math.round(70 * v / max));
            return `<div title="${x.date}: ${v}" style="flex:1;display:flex;align-items:flex-end;height:72px">
              <div style="width:100%;height:${h}px;background:#29c5c8;border-radius:3px 3px 0 0;opacity:${x === d[d.length - 1] ? .55 : 1}"></div></div>`; }).join('');
          const total = d.slice(0, -1).reduce((a, x) => a + (x['visitors'] || 0), 0);
          return `<div style="text-align:left">
            <div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:14px">Visitors per day</b>
              <span style="font-size:12px;opacity:.7">30 days: ${ltr(total.toLocaleString('en-US'))}</span></div>
            <div dir="ltr" style="display:flex;gap:2px;margin-top:8px">${bars}</div>
            <div dir="ltr" style="display:flex;justify-content:space-between;font-size:11px;opacity:.6;margin-top:3px">
              <span>${d[0].date.slice(5)}</span><span>Today</span></div></div>`; ]]]
      styles:
        card:
        - border-radius: 22px
        - direction: ltr
        - box-shadow: 0 6px 18px rgba(0,0,0,.18)
        - padding: 14px
        grid:
        - grid-template-areas: '"body"'
        custom_fields:
          body:
          - justify-self: stretch
          - white-space: normal
    - type: custom:button-card
      entity: sensor.cloudflare_example_com_example_com_visitors_today
      show_name: false
      show_icon: false
      show_state: false
      tap_action:
        action: more-info
        entity: sensor.cloudflare_example_com_example_com_visitors_today
      hold_action:
        action: none
      custom_fields:
        body: |-
          [[[
          const ltr = t => '⁦' + t + '⁩';  // keep numbers+units in reading order
          const d = (entity && entity.attributes && entity.attributes.daily) || [];
          if (!d.length) return `<div style="opacity:.7;font-size:13px">No data yet</div>`;
          const max = Math.max(1, ...d.map(x => x['page_views'] || 0));
          const bars = d.map(x => { const v = x['page_views'] || 0; const h = Math.max(2, Math.round(70 * v / max));
            return `<div title="${x.date}: ${v}" style="flex:1;display:flex;align-items:flex-end;height:72px">
              <div style="width:100%;height:${h}px;background:#3b82f6;border-radius:3px 3px 0 0;opacity:${x === d[d.length - 1] ? .55 : 1}"></div></div>`; }).join('');
          const total = d.slice(0, -1).reduce((a, x) => a + (x['page_views'] || 0), 0);
          return `<div style="text-align:left">
            <div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:14px">Page views per day</b>
              <span style="font-size:12px;opacity:.7">30 days: ${ltr(total.toLocaleString('en-US'))}</span></div>
            <div dir="ltr" style="display:flex;gap:2px;margin-top:8px">${bars}</div>
            <div dir="ltr" style="display:flex;justify-content:space-between;font-size:11px;opacity:.6;margin-top:3px">
              <span>${d[0].date.slice(5)}</span><span>Today</span></div></div>`; ]]]
      styles:
        card:
        - border-radius: 22px
        - direction: ltr
        - box-shadow: 0 6px 18px rgba(0,0,0,.18)
        - padding: 14px
        grid:
        - grid-template-areas: '"body"'
        custom_fields:
          body:
          - justify-self: stretch
          - white-space: normal
  - type: grid
    cards:
    - type: heading
